# mobile-bex: Android Chromium ビルド CI
# Self-hosted runner 推奨 (Standard runner ではディスク容量が不足)
name: Build Android Chromium

on:
  workflow_dispatch:
    inputs:
      chromium_version:
        description: "Chromium version tag (e.g. 145.0.7632.45)"
        required: false
        default: ""
      target_cpu:
        description: "Target CPU architecture"
        required: false
        default: "arm64"
        type: choice
        options:
          - arm64
          - arm
          - x64
          - x86

env:
  CHROMIUM_DIR: ${{ github.workspace }}/chromium
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    # Self-hosted runner with sufficient disk (200GB+) and RAM (32GB+)
    runs-on: self-hosted
    timeout-minutes: 480  # 8 hours max

    steps:
      - name: Checkout mobile-bex
        uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-${{ inputs.target_cpu }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ inputs.target_cpu }}-

      - name: Setup depot_tools
        run: |
          if [ ! -d "$HOME/depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          fi
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium source
        run: |
          if [ ! -d "$CHROMIUM_DIR/src" ]; then
            mkdir -p "$CHROMIUM_DIR"
            cd "$CHROMIUM_DIR"
            fetch --nohooks --no-history android
          fi

      - name: Checkout version
        if: inputs.chromium_version != ''
        working-directory: ${{ env.CHROMIUM_DIR }}/src
        run: |
          git fetch --tags
          git checkout "tags/${{ inputs.chromium_version }}"

      - name: Install dependencies & sync
        working-directory: ${{ env.CHROMIUM_DIR }}/src
        run: |
          gclient sync
          gclient runhooks

      - name: Apply mobile-bex patches
        run: |
          export CHROMIUM_DIR="${{ env.CHROMIUM_DIR }}"
          ./scripts/apply-patches.sh --phase 1

      - name: Configure build
        working-directory: ${{ env.CHROMIUM_DIR }}/src
        run: |
          export CHROMIUM_DIR="${{ env.CHROMIUM_DIR }}"
          ./../../mobile-bex/scripts/build.sh --setup --cpu ${{ inputs.target_cpu }}

      - name: Build Chrome APK
        working-directory: ${{ env.CHROMIUM_DIR }}/src
        run: |
          ccache -M 50G
          export CCACHE_CPP2=yes
          export CCACHE_SLOPPINESS=time_macros
          autoninja -C out/MobileBex chrome_public_apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-bex-${{ inputs.target_cpu }}
          path: ${{ env.CHROMIUM_DIR }}/src/out/MobileBex/apks/ChromePublic.apk
          retention-days: 30

      - name: Save ccache stats
        run: ccache -s
