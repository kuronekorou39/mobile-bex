<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Tab Page Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #0f172a; color: #e2e8f0; padding: 24px; }
    h1 { color: #38bdf8; margin-bottom: 12px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin: 16px 0; }
    .pass { color: #22c55e; font-weight: bold; }
    .info { color: #94a3b8; font-size: 14px; margin: 8px 0; }
    #results div { padding: 6px 0; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>
  <h1>Full Tab Page Test</h1>
  <div class="card">
    <p class="pass">PASS — This page is running in a full browser tab!</p>
    <div class="info" id="info"></div>
  </div>
  <div class="card" id="results"></div>
  <script src="page.js"></script>
</body>
</html>
