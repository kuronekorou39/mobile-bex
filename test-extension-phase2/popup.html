<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 100%;
      max-width: 100vw;
      box-sizing: border-box;
      padding: 16px;
      font-family: sans-serif;
      font-size: 14px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #4fc3f7;
    }
    .test {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #333;
    }
    .pass { color: #66bb6a; }
    .fail { color: #ef5350; }
    .wait { color: #ffa726; }
    #tabs-list {
      margin-top: 12px;
      font-size: 12px;
      color: #aaa;
      max-height: 200px;
      overflow-y: auto;
    }
    #tabs-list div {
      padding: 4px 0;
      border-bottom: 1px solid #222;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>mobile-bex API Test</h1>
  <div id="results">
    <div class="test"><span>Loading...</span><span class="wait">...</span></div>
  </div>
  <div id="tabs-list"></div>
  <script src="popup.js"></script>
</body>
</html>
