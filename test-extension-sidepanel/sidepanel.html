<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      font-size: 14px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px;
      color: #4fc3f7;
    }
    .info {
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }
    .label { color: #aaa; font-size: 12px; }
    .value { color: #eee; margin-top: 2px; }
    #close-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: #c62828;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    #close-btn:active { background: #b71c1c; }
  </style>
</head>
<body>
  <h1>Side Panel Content</h1>
  <div class="info">
    <div class="label">Extension ID</div>
    <div class="value" id="ext-id">—</div>
  </div>
  <div class="info">
    <div class="label">User Agent</div>
    <div class="value" id="ua">—</div>
  </div>
  <div class="info">
    <div class="label">Platform</div>
    <div class="value" id="platform">—</div>
  </div>
  <div class="info">
    <div class="label">Viewport</div>
    <div class="value" id="viewport">—</div>
  </div>
  <div class="info">
    <div class="label">Timestamp</div>
    <div class="value" id="timestamp">—</div>
  </div>
  <button id="close-btn">Close Side Panel</button>
  <script>
    document.getElementById("ext-id").textContent = chrome.runtime.id;
    document.getElementById("ua").textContent = navigator.userAgent;
    document.getElementById("platform").textContent = navigator.platform;
    document.getElementById("viewport").textContent =
      window.innerWidth + " x " + window.innerHeight;
    document.getElementById("timestamp").textContent = new Date().toISOString();

    document.getElementById("close-btn").addEventListener("click", () => {
      window.close();
    });
  </script>
</body>
</html>
