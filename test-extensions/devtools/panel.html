<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BEX DevTools Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #1e1e1e; color: #d4d4d4; padding: 16px; }
    h1 { color: #569cd6; font-size: 18px; margin-bottom: 12px; }
    .pass { color: #6a9955; font-weight: bold; margin-bottom: 16px; }
    .card { background: #252526; border: 1px solid #3c3c3c; border-radius: 8px; padding: 16px; margin: 12px 0; }
    button { background: #0e639c; color: white; border: none; border-radius: 4px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
    #output { font-family: monospace; font-size: 12px; color: #ce9178; margin-top: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>BEX DevTools Panel</h1>
  <p class="pass">PASS — DevTools panel loaded!</p>
  <div class="card">
    <button id="inspect-btn">Inspect Page Info</button>
    <pre id="output"></pre>
  </div>
  <div class="card">
    <button id="eval-btn">Eval: document.title</button>
    <pre id="eval-output"></pre>
  </div>
  <script src="panel.js"></script>
</body>
</html>
