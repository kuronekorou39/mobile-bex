<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #0f172a; color: #e2e8f0; padding: 16px; width: 300px; }
    h2 { color: #38bdf8; font-size: 16px; margin-bottom: 12px; }
    button { background: #2563eb; color: white; border: none; border-radius: 8px; padding: 10px 16px; width: 100%; font-size: 14px; cursor: pointer; margin: 4px 0; }
    button.warn { background: #dc2626; }
    button.success { background: #22c55e; }
    #status { color: #94a3b8; font-size: 12px; margin-top: 12px; min-height: 20px; }
  </style>
</head>
<body>
  <h2>Notifications Test</h2>
  <button id="basic">Basic Notification</button>
  <button id="progress" class="success">Progress Notification</button>
  <button id="buttons" class="warn">Notification with Buttons</button>
  <button id="clear">Clear All</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
