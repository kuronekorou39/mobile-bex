<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extension Options</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #0f172a; color: #e2e8f0; padding: 24px; }
    h1 { color: #38bdf8; margin-bottom: 16px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin: 16px 0; }
    label { display: block; margin: 12px 0 4px; color: #94a3b8; font-size: 14px; }
    input, select { background: #334155; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px; padding: 8px 12px; width: 100%; font-size: 14px; }
    button { background: #22c55e; color: white; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; margin-top: 16px; }
    #status { color: #22c55e; margin-top: 8px; font-size: 14px; }
    .pass { color: #22c55e; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Extension Options</h1>
  <div class="card">
    <p class="pass">PASS — Options page loaded successfully!</p>
  </div>
  <div class="card">
    <label>Theme</label>
    <select id="theme">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="auto">Auto</option>
    </select>
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username">
    <button id="save">Save Settings</button>
    <p id="status"></p>
  </div>
  <script src="options.js"></script>
</body>
</html>
