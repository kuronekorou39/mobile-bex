<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 100%;
      max-width: 100vw;
      box-sizing: border-box;
      padding: 16px;
      font-family: sans-serif;
      font-size: 14px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #4fc3f7;
    }
    .test {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #333;
    }
    .pass { color: #66bb6a; }
    .fail { color: #ef5350; }
    .wait { color: #ffa726; }
    #summary {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }
    .summary-pass { background: #1b5e20; color: #66bb6a; }
    .summary-fail { background: #b71c1c; color: #ef5350; }
    #retry-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      background: #1565c0;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    #retry-btn:active { background: #0d47a1; }
    #open-panel-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    #open-panel-btn:active { background: #1b5e20; }
  </style>
</head>
<body>
  <h1>sidePanel API Test</h1>
  <div id="results">
    <div class="test"><span>Loading...</span><span class="wait">...</span></div>
  </div>
  <div id="summary"></div>
  <button id="retry-btn">Retry Tests</button>
  <button id="open-panel-btn">Open Side Panel</button>
  <script src="popup.js"></script>
</body>
</html>
